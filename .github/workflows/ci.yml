# =============================================================================
# Pipeline CI/CD du projet
# -----------------------------------------------------------------------------
#   Pull request  ->  tests  ->  terraform plan   (lecture seule, rien ne change)
#   Push sur main ->  tests  ->  terraform apply  (déploiement réel sur AWS)
#
# Prérequis (une fois, après le bootstrap) — dans GitHub :
#   Settings > Secrets and variables > Actions > onglet "Variables" :
#     AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN
#   (valeurs affichées par "terraform output" dans bootstrap/)
# =============================================================================

name: ci

# --- Déclencheurs -------------------------------------------------------------
on:
  pull_request: # toute pull request
  push:
    branches: [main] # toute fusion (ou push direct) sur main
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

# --- Permissions du jeton GitHub ---------------------------------------------
# Par défaut, on donne le strict minimum :
#   contents: read  -> lire le code du dépôt
#   id-token: write -> demander un jeton OIDC à GitHub (pour AWS).
#                      "write" signifie « émettre un jeton », pas « écrire
#                      dans le dépôt ».
permissions:
  contents: read
  id-token: write

# --- Une seule exécution Terraform à la fois ----------------------------------
# Si deux pipelines démarrent en même temps, le second ATTEND le premier
# (cancel-in-progress: false) : on n'interrompt jamais un apply en cours.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Variables communes à tous les jobs.
env:
  TF_IN_AUTOMATION: "true" # adapte les messages Terraform à un usage en CI
  TF_INPUT: "false" # Terraform ne pose jamais de question (sinon il bloquerait)

jobs:
  # ===========================================================================
  # JOB 1 — Qualité du code Python
  # ===========================================================================
  tests:
    name: Tests Python
    runs-on: ubuntu-latest # machine virtuelle fournie gratuitement par GitHub
    steps:
      # Récupère le code du dépôt sur la machine.
      - uses: actions/checkout@v4

      # Installe Python 3.12, avec un cache des paquets pip pour aller plus vite.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        run: pip install -r requirements-dev.txt

      # Linter : erreurs, imports, mauvaises pratiques.
      - name: Lint (ruff)
        run: ruff check .

      # Formatage : échoue si un fichier n'est pas formaté.
      # Correction en local : "ruff format ."
      - name: Format (ruff)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  # ===========================================================================
  # JOB 2 — Terraform plan (pull requests uniquement)
  # Montre ce qui CHANGERAIT dans AWS, sans rien modifier.
  # ===========================================================================
  terraform-plan:
    name: Terraform plan
    needs: tests # ne démarre que si les tests sont verts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra # toutes les commandes "run" partent de infra/
    steps:
      - uses: actions/checkout@v4

      # Installe Terraform. "<2.0.0" = dernière version 1.x disponible.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"

      # Le fameux échange OIDC : jeton GitHub -> identifiants AWS temporaires.
      # Aucune clé n'apparaît ici, seulement l'ARN du rôle à endosser.
      - name: Connexion AWS (rôle plan, lecture seule)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Vérifie l'indentation/le style. Correction en local : "terraform fmt -recursive"
      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Télécharge le provider AWS et se connecte au state dans S3.
      # On complète ici la configuration « partielle » du backend.
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # Vérifie que le code est cohérent (syntaxe, références, types).
      - name: terraform validate
        run: terraform validate

      # Calcule le plan et l'affiche dans le résumé du pipeline
      # (onglet Actions > l'exécution > « Summary »).
      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # JOB 3 — Terraform apply (main uniquement)
  # Déploie réellement sur AWS.
  # ===========================================================================
  terraform-apply:
    name: Terraform apply
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"

      # Rôle "apply" : AWS n'accepte de le donner qu'à un jeton venant de main.
      - name: Connexion AWS (rôle apply)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # On recalcule le plan sur le code de main, on l'enregistre (tfplan)...
      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      # ... puis on applique CE plan précis. Si l'état d'AWS a changé entre
      # les deux commandes, Terraform refuse : rien d'imprévu n'est appliqué.
      # Pas de "-auto-approve" nécessaire avec un plan enregistré.
      - name: terraform apply
        run: terraform apply -no-color tfplan

      - name: Résumé
        run: |
          {
            echo "## Déploiement terminé"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
